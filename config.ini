# cf-realip-sync settings.  Every key has a built-in default; this file
# documents them.  Edit, commit, push, then run deploy/update.sh on the host.

[source]
ipv4_url = https://www.cloudflare.com/ips-v4
ipv6_url = https://www.cloudflare.com/ips-v6
# Seconds per request; tries per list (5 s, 10 s backoff between tries)
timeout = 20
retries = 3

[sanity]
# Refuse lists shorter than this (Cloudflare publishes ~15 IPv4, ~7 IPv6)
min_ipv4 = 10
min_ipv6 = 5
# Refuse a run that would drop more than this share of the current ranges
max_removed_fraction = 0.5

[nginx]
output = /etc/nginx/conf.d/cloudflare-realip.conf
header = CF-Connecting-IP
test_cmd = nginx -t -q
reload_cmd = systemctl reload nginx

[notify]
# Mail a summary when the ranges change (failures always alert via systemd)
on_change = yes
mail_to = root
